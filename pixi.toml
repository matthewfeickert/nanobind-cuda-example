# ── The umbrella workspace: all four stages side by side ──────────────────
# Each stage under ./templates is a self-contained workspace of its own. This
# manifest pulls the four packages into one environment so a single benchmark
# can compare them, and it builds the book.
[workspace]
name = "nanobind-cuda-example"
channels = ["conda-forge"]
# Declare that this platform provides a CUDA driver (the `__cuda` virtual
# package). This is what lets the solver pick GPU-enabled builds.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "13" }]
preview = ["pixi-build"]

[dependencies]
# The four stages as source dependencies: `pixi run` and `pixi install`
# rebuild them automatically whenever their sources change.
pairwise-numpy = { path = "templates/01-numpy/packages/pairwise-numpy" }
pairwise-jax = { path = "templates/02-jax/packages/pairwise-jax" }
pairwise-cuda-python = { path = "templates/03-cuda-python/packages/pairwise-cuda-python" }
gpu-pairwise = { path = "templates/04-nanobind-cuda/packages/gpu-pairwise" }
# Used by the benchmark and the tests as CPU references.
numpy = ">=2.3"
scipy = ">=1.16"
scikit-learn = ">=1.7"

[feature.test.dependencies]
pytest = ">=8"

[feature.docs.dependencies]
mystmd = ">=1.10"

[feature.lint.dependencies]
prek = ">=0.5"

[environments]
test = ["test"]
docs = { features = ["docs"], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }

# ── Tasks ───────────────────────────────────────────────────────────────────
[tasks.bench]
cmd = "python scripts/bench.py"
description = "Time all four stages against SciPy and scikit-learn"
# JAX preallocates 75% of device memory when its CUDA backend starts, which
# would starve the cuda-python and nanobind stages running in the same
# process. Make it allocate on demand instead.
env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false" }

[feature.test.tasks.test]
cmd = "pytest -v --import-mode=importlib --rootdir . templates/01-numpy/packages/pairwise-numpy/tests templates/02-jax/packages/pairwise-jax/tests templates/03-cuda-python/packages/pairwise-cuda-python/tests templates/04-nanobind-cuda/packages/gpu-pairwise/tests"
# importlib mode because the four suites share the file name test_pairwise.py.
description = "Run the test suites of all four stages"

[feature.docs.tasks.docs-build]
cmd = "myst build --html"
cwd = "book"
description = "Build the book as static HTML into book/_build/html"

[feature.docs.tasks.docs-start]
cmd = "myst start"
cwd = "book"
description = "Serve the book locally with live reload"

[feature.lint.tasks.lint]
cmd = "prek run --all-files"
description = "Run the pre-commit hooks in .pre-commit-config.yaml on every file"

# Pin which CUDA compiler package the build backend resolves
# `compilers = ["cuda"]` to for stage 4. On conda-forge, CUDA 12+ compilers
# live in the `cuda-nvcc` packages.
[workspace.build-variants]
cuda_compiler = ["cuda-nvcc"]
cuda_compiler_version = ["13.1"]
