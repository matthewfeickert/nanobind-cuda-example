# ── The umbrella workspace: all three stages side by side ──────────────────
# Each stage under ./templates is a self-contained workspace of its own. This
# manifest pulls the three packages into one environment so a single benchmark
# can compare them, and it builds the book.
[workspace]
name = "nanobind-cuda-example"
channels = ["conda-forge"]
# Declare that this platform provides a CUDA driver (the `__cuda` virtual
# package). This is what lets the solver pick GPU-enabled builds.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "13" }]
preview = ["pixi-build"]

[dependencies]
# The three stages as source dependencies: `pixi run` and `pixi install`
# rebuild them automatically whenever their sources change.
pairwise-numpy = { path = "templates/01-numpy/packages/pairwise-numpy" }
pairwise-cuda-python = { path = "templates/02-cuda-python/packages/pairwise-cuda-python" }
gpu-pairwise = { path = "templates/03-nanobind-cuda/packages/gpu-pairwise" }
# Used by the benchmark and the tests as CPU references.
numpy = ">=2.3"
scipy = ">=1.16"
scikit-learn = ">=1.7"

[feature.test.dependencies]
pytest = ">=8"

[feature.docs.dependencies]
mystmd = ">=1.10"

[environments]
test = ["test"]
docs = { features = ["docs"], no-default-feature = true }

# ── Tasks ───────────────────────────────────────────────────────────────────
[tasks.bench]
cmd = "python scripts/bench.py"
description = "Time all three stages against SciPy and scikit-learn"

[feature.test.tasks.test]
cmd = "pytest -v --import-mode=importlib --rootdir . templates/01-numpy/packages/pairwise-numpy/tests templates/02-cuda-python/packages/pairwise-cuda-python/tests templates/03-nanobind-cuda/packages/gpu-pairwise/tests"
# importlib mode because the three suites share the file name test_pairwise.py.
description = "Run the test suites of all three stages"

[feature.docs.tasks.docs-build]
cmd = "myst build --html"
cwd = "book"
description = "Build the book as static HTML into book/_build/html"

[feature.docs.tasks.docs-start]
cmd = "myst start"
cwd = "book"
description = "Serve the book locally with live reload"

# Pin which CUDA compiler package the build backend resolves
# `compilers = ["cuda"]` to for stage 3. On conda-forge, CUDA 12+ compilers
# live in the `cuda-nvcc` packages.
[workspace.build-variants]
cuda_compiler = ["cuda-nvcc"]
cuda_compiler_version = ["13.1"]
