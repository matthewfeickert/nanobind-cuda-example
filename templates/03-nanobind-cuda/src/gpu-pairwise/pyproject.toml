[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.5"]
build-backend = "scikit_build_core.build"

[project]
name = "gpu-pairwise"
version = "0.1.0"
description = "Pairwise Euclidean distances on the GPU: a CUDA kernel exposed to NumPy through nanobind."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.3,<3",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/gpu_pairwise"]
# The CUDA toolchain, CMake and Ninja all come from the conda build/host
# environments, so do not let scikit-build-core fetch its own from PyPI.
cmake.version = ">=3.26"
ninja.make-fallback = false
