# ── Stage 2: the JAX workspace ─────────────────────────────────────────────
# One workspace that builds one source package from ./packages:
#   * pairwise-jax — a pure Python package whose array program XLA compiles
#     for the GPU at first call. No kernel is written.
[workspace]
name = "jax"
channels = ["conda-forge"]
# Declare that this platform provides a CUDA driver (the `__cuda` virtual
# package). jaxlib's CUDA builds require it.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "13" }]
preview = ["pixi-build"]

[dependencies]
# Our own package as a source dependency: `pixi run` and `pixi install`
# rebuild it automatically whenever its sources change.
pairwise-jax = { path = "packages/pairwise-jax" }
numpy = ">=2.3"
# The reference implementation the benchmark and the tests compare against.
scipy = ">=1.16"

[feature.test.dependencies]
pytest = ">=8"

[environments]
test = ["test"]

# ── Tasks ───────────────────────────────────────────────────────────────────
[tasks.demo]
cmd = "python scripts/demo.py"
description = "Smallest possible end-to-end use of the package"

[tasks.bench]
cmd = "python scripts/bench.py"
description = "Time pairwise distances: SciPy vs the XLA-compiled broadcast"

[feature.test.tasks.test]
cmd = "pytest -v packages/pairwise-jax/tests"
description = "Check the JAX implementation against scipy.spatial.distance.cdist"

# No [workspace.build-variants]: there is no compiler to pin because nothing
# is compiled when the package is built.
