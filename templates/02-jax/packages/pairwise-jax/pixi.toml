# ── The pairwise-jax package: what `pixi publish` turns into a .conda file ─
# A *package* manifest only (no `[workspace]`). Name, version and runtime
# dependencies are read from the adjacent pyproject.toml. The workspace that
# consumes it lives in ../../pixi.toml.
[package.build]
backend = { name = "pixi-build-python", version = "0.*" }
# Nothing is compiled: XLA compiles the array program at first call. So no
# `config.compilers`, and the package is `noarch: python` exactly like stage 1.
# Map `[project.dependencies]` in pyproject.toml onto conda-forge packages.
config.ignore-pypi-mapping = false

[package.host-dependencies]
# The backend runs `uv pip install --no-build-isolation`, so the PEP 517
# build backend named in pyproject.toml has to be present already.
hatchling = "*"

[package.run-dependencies]
# `jax` on PyPI is the pure Python front end; the GPU support lives in
# `jaxlib`, which conda-forge builds once per CUDA generation and once for
# the CPU. Nothing in pyproject.toml can express "the CUDA 13 build", so the
# choice is written here, by hand, as a build string constraint.
jaxlib = { version = "*", build = "cuda13*" }
cuda-version = "13.*"
