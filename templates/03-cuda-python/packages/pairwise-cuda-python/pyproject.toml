[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pairwise-cuda-python"
version = "0.1.0"
description = "Pairwise Euclidean distances on the GPU: a CUDA kernel compiled at runtime with NVRTC and launched through cuda.core."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.3",
    "cuda-core>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pairwise_cuda_python"]
