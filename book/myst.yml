# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Packaging a CUDA kernel for Python with Pixi Build
  description: |
    A walkthrough of one example package in four stages, from NumPy to JAX to a runtime-compiled kernel driven by cuda-python to a nanobind extension module compiled ahead of time and turned into a conda package with Pixi Build.
    Every command output shown was captured from a real run, so the material can be followed without a GPU at hand.
  keywords: [pixi, pixi-build, cuda, cuda-python, nanobind, scikit-build-core, conda, python, reproducible]
  authors:
    - name: "Matthew Feickert"
      id: matthew-feickert
      affiliations:
        - id: uw-madison
          institution: University of Wisconsin-Madison
          department: Data Science Institute
      orcid: "0000-0003-4124-7862"
      github: matthewfeickert
  github: https://github.com/matthewfeickert/nanobind-cuda-example
  abbreviations:
    CUDA: "Compute Unified Device Architecture"
    GPU: "Graphics Processing Unit"
    CPU: "Central Processing Unit"
    ABI: "Application Binary Interface"
    TOML: "Tom's Obvious, Minimal Language"
    NVRTC: "NVIDIA Runtime Compilation"
    JIT: "Just-In-Time"
    DLPack: "an open in-memory tensor exchange protocol"
    XLA: "Accelerated Linear Algebra, the compiler behind JAX"
  toc:
    - file: index.md
    - file: stages.md
    - file: stage-numpy.md
    - file: stage-jax.md
    - file: stage-cuda-python.md
    - file: stage-nanobind.md
      children:
        - file: workspace.md
        - file: package.md
        - file: kernel.md
        - file: running.md
        - file: distributing.md
    - file: next-steps.md

site:
  template: book-theme
